[project]
name = "heymandex-vla-data-engineering"
version = "0.1.0"
description = "Data engineering pipeline for RM65 + SG100 arm-hand VLA datasets."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=10,<13",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
